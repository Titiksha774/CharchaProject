version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: charcha
      POSTGRES_PASSWORD: charcha_secret
      POSTGRES_DB: charcha
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charcha -d charcha"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://charcha:charcha_secret@db:5432/charcha
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string-in-production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
